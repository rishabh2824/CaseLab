[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.40",
    "boto3-stubs~=1.43.40",
    "dotenv>=0.9.9",
    "fastapi>=0.139.0",
    "google-auth>=2.55.2",
    "httpx>=0.28.1",
    "libsql-client>=0.3.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "sse-starlette>=3.4.5",
    "tenacity>=9.1.4",
    "uvicorn>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
