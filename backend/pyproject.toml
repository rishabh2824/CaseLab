[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.40",
    "botocore>=1.43.49",
    "cachecontrol>=0.14.4",
    "fastapi>=0.139.0",
    "google-auth>=2.55.2",
    "httpx>=0.28.1",
    "libsql-client>=0.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "redis>=6.0",
    "requests>=2.34.2",
    "sse-starlette>=3.4.5",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpath = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.deptry.package_module_name_map]
pyjwt = ["jwt"]
google-auth = ["google"]