[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "boto3>=1.43.40",
    "botocore>=1.43.49",
    "cachecontrol>=0.14.4",
    "fastapi>=0.139.0",
    "google-auth>=2.55.2",
    "httpx>=0.28.1",
    "openai>=1.50",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "sqlmodel>=0.0.39",
    "sse-starlette>=3.4.5",
    "uvicorn[standard]>=0.50.0",
]

[dependency-groups]
dev = [
    "deptry>=0.24.1",
    "hypothesis>=6.165.0",
    "mypy>=1.14.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "time-machine>=3.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Without this, pytest's legacy prepend import mode derives a module name from
# the file's basename alone, so tests/unit/test_run_store.py and
# tests/integration/test_run_store.py collide and collection fails outright.
# importlib mode keys modules by full path, which is what lets the unit and
# integration suites name a file after the module it covers, in both places.
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
# tests/integration/** is auto-marked `db` by tests/conftest.py, so the fast,
# hermetic suite is `pytest -m "not db"` and needs no database at all.
markers = [
    "db: hits a real Postgres; creates and deletes rows. Excluded by -m 'not db'.",
]
# infra/db.py's engine/session-factory are process-lifetime @lru_cache singletons
# (correct in the real app, which has one event loop for its whole life) — tests
# need to share that same single event loop too, or asyncpg connections created
# in one test's loop break when reused from a different test's loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error::DeprecationWarning",
    # SQLModel nudges every session.execute() call toward session.exec(), but
    # exec() has no rowcount-bearing equivalent for Core UPDATE/DELETE — the
    # conditional version-lock UPDATE in services/cases.py and the bulk
    # collaborator DELETEs in services/cases.py and services/admin.py
    # genuinely need session.execute() and can't be rewritten around this.
    "ignore::DeprecationWarning:services.cases",
    "ignore::DeprecationWarning:services.admin",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
# tests/unit/test_run_store.py and tests/integration/test_run_store.py share a
# basename with no __init__.py between them (see pytest's own
# --import-mode=importlib note above for why) -- mypy has no per-invocation
# equivalent, so tests/ is out of scope here; the goal of this gate is typing
# the source tree (services/, api/, infra/, models/), not the test suite.
exclude = ["^alembic/versions/", "^tests/"]

# First-run findings, scoped rather than fixed (start loose, ratchet up
# later): the overrides below are all pre-existing typing friction the first
# `mypy .` run surfaced, not something introduced by adding this gate.

[[tool.mypy.overrides]]
# SQLModel's typed Column descriptors don't satisfy SQLAlchemy Core's
# ColumnElement[bool]-shaped typing for equality/in_/case/where/or_/asc
# expressions -- a widely-known SQLModel/mypy friction point, not an actual
# bug in these modules' query-building code.
module = ["infra.rate_limits", "services.cases", "services.admin", "services.simulation.run_store"]
disable_error_code = ["arg-type", "call-overload", "union-attr", "attr-defined"]

[[tool.mypy.overrides]]
# pydantic-settings' BaseSettings subclass is instantiated with zero args
# everywhere in this codebase (env vars supply every field) -- mypy sees the
# field-derived __init__ signature and flags each field as a "missing" named
# argument at the one real call site.
module = "infra.settings"
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
# The openai SDK's overloaded AsyncCompletions.create() signature doesn't
# resolve against this wrapper's dict-of-kwargs call shape.
module = "infra.llm"
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
# Genuine gaps (a couple of untyped local lists, two reads through an
# Optional dict) -- real findings to revisit, not suppressed as noise; parked
# here for now per this task's "start loose" scope.
module = "services.simulation.service"
disable_error_code = ["var-annotated", "union-attr"]

[[tool.mypy.overrides]]
# ContactOut.profile_photo's url is sourced from a str | None upstream field;
# a genuine narrowing gap to revisit, parked here for the same reason as above.
module = "models.simulations"
disable_error_code = ["arg-type"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Correctness-focused, not style-focused: this gate exists to catch real
# defects (undefined names, shadowed loop variables, mutable defaults, blocking
# calls in async code), not to relitigate the codebase's formatting.
select = ["E4", "E7", "E9", "F", "W", "B", "ASYNC", "UP", "RUF", "TID251"]
ignore = [
    # `if not x: raise ...` on one line is this codebase's deliberate,
    # consistently-applied style.
    "E701",
    # FastAPI's whole dependency system is `= Depends(...)` in a default.
    "B008",
    # zip() over pending_referrals/referral_results, which asyncio.gather
    # guarantees are the same length.
    "B905",
    # `timeout` is a real parameter of the LLM wrappers, forwarded to the
    # OpenAI client rather than implemented with asyncio.timeout.
    "ASYNC109",
    # Pydantic/SQLModel class attributes are declarations, not mutable
    # class-level defaults.
    "RUF012",
]

# Enforces the layering the codebase already describes (api -> services ->
# infra, with models/ and the root domain_*.py modules shared beneath all
# three): infra/ and models/ must never import services/ or api/, on pain of
# the api -> services -> infra cycle infra/rate_limit.py used to have. This
# makes the rule checked instead of merely documented; TID251 is disabled
# again per-directory below for every package that's actually allowed to
# import "up" (api/, services/) or that sits above the layering entirely
# (main.py, the composition root).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"services".msg = "infra/ and models/ must not depend on services/ (api -> services -> infra; models/ is shared beneath all three). Move the shared code down instead."
"api".msg = "infra/, services/, and models/ must not depend on api/ — api is the top layer."

[tool.ruff.lint.per-file-ignores]
# Fixtures legitimately shadow the names they patch, and assert is the point.
"tests/**" = ["S101", "B011", "TID251"]
# api/ legitimately depends on services/; services/ legitimately depends on
# other services/ modules. main.py is the composition root wiring api/ in.
"api/**" = ["TID251"]
"services/**" = ["TID251"]
"main.py" = ["TID251"]

[tool.deptry.package_module_name_map]
pyjwt = ["jwt"]
google-auth = ["google"]

[tool.deptry.per_rule_ignores]
# Runtime-only dependencies deptry can't see: uvicorn is the ASGI entrypoint
# (invoked as `uvicorn main:app`, never imported), and asyncpg is loaded
# indirectly by SQLAlchemy through the `postgresql+asyncpg://` DSN scheme in
# infra/db.py, not imported by name anywhere in the codebase.
DEP002 = ["uvicorn", "asyncpg"]
