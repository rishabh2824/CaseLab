<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/uwlogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wisconsin Case Lab</title>
    <!-- LCP element on the landing page (see .landing-bg in index.css) — preloaded
         with high priority since it's a CSS background-image and would otherwise
         be discovered late by the browser's preload scanner. This file is ONLY
         ever served at "/" (index_document in the DO App Platform static-site
         spec) — every other route is served by app.html (catchall_document),
         an otherwise-identical copy without this preload, so non-landing routes
         don't waste a fetch on an image they never render. See vite.config.js
         for the matching local-dev routing and frontend/app.html. -->
    <link rel="preload" as="image" href="/src/assets/Bg.webp" type="image/webp" fetchpriority="high" />
    <!-- Only cross-origin the landing page contacts: Google's GSI script, loaded
         by GoogleOAuthProvider for the Admin Login button. -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
