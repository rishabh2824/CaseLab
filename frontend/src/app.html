<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Wisconsin Case Lab</title>
		<!-- Google's GSI script (loaded by SignInButton.svelte on mount, only when
			 an admin sign-in button is actually rendered) is the one cross-origin
			 contact — preconnect early so that later fetch isn't cold. -->
		<link rel="preconnect" href="https://accounts.google.com" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
