allowBuilds:
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  # msw's postinstall only writes its browser service worker; the tests use
  # msw/node exclusively, so there is nothing to build.
  msw: false

overrides:
  # Pinned to the patched 4.3.x line rather than an open '>=4.3.0'. The open
  # range resolved to js-yaml 5.x, whose API dropped `types.merge`, which
  # @redocly/openapi-core (a transitive dependency of openapi-typescript)
  # reads at import time — that crash is what silently broke `pnpm gen:api`
  # and let frontend/src/lib/api/schema.d.ts drift from the backend's OpenAPI
  # schema. ^4.3.0 still satisfies the security floor this override exists for.
  js-yaml: ^4.3.0
  cookie: '>=0.7.0 <2.0.0'
